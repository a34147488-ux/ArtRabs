<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ArtRabs</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

    <header>
        <h1>ArtRabs</h1>
    </header>


    <section class="balance">

        <div class="card">
            ⭐ Stars

            <span id="stars">
                0
            </span>
        </div>


        <div class="card">

            🟣 Multi Stars

            <span id="multi">
                0
            </span>

        </div>

    </section>



    <section class="clicker">

        <div class="worker-image">

            👷

        </div>


        <h2>
            Рабочий
        </h2>


        <button id="clickBtn">

            КЛИКНУТЬ

        </button>


        <p>

            +1 Multi Star за действие

        </p>


    </section>



    <section class="bonus">


        <h3>
            🎁 Ежедневная рулетка
        </h3>


        <button id="wheelBtn">

            Крутить

        </button>


    </section>




    <nav class="menu">


        <button>
            Главная
        </button>


        <button>
            Работники
        </button>


        <button>
            Рефералы
        </button>


        <button>
            Кейсы
        </button>


        <button>
            Профиль
        </button>


    </nav>


</div>



<script src="script.js"></script>

</body>
</html>
